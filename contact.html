<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — AIToolsReview</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--black:#0a0a0a;--white:#f5f5f0;--accent:#00e5a0;--gray:#1a1a1a;--gray3:#888;--text:#d0d0c8;--border:#222;--card-bg:#111;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.8;}
    nav{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--white);text-decoration:none;}
    .nav-logo span{color:var(--accent);}
    .content{max-width:600px;margin:0 auto;padding:80px 40px;}
    h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--white);margin-bottom:12px;}
    p{margin-bottom:28px;color:var(--gray3);}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--gray3);margin-bottom:6px;}
    input,textarea{width:100%;background:var(--gray);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;resize:vertical;}
    input:focus,textarea:focus{border-color:var(--accent);}
    button{background:var(--accent);color:var(--black);border:none;border-radius:10px;padding:14px 28px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:opacity .2s;}
    button:hover{opacity:.85;}
    .note{font-size:13px;color:#444;margin-top:16px;}
    footer{border-top:1px solid var(--border);padding:30px 40px;text-align:center;font-size:13px;color:var(--gray3);}
  </style>
</head>
<body>
<nav><a class="nav-logo" href="/">AI<span>Tools</span>Review</a></nav>
<div class="content">
  <h1>Get in touch</h1>
  <p>Have a question, want to suggest an AI tool for us to review, or spotted an error? We'd love to hear from you.</p>
  <div class="form-group"><label>Your name</label><input type="text" placeholder="Jane Smith"></div>
  <div class="form-group"><label>Email address</label><input type="email" placeholder="jane@example.com"></div>
  <div class="form-group"><label>Message</label><textarea rows="5" placeholder="Tell us what's on your mind..."></textarea></div>
  <button onclick="alert('Thanks! (Connect a form service like Formspree to make this work)')">Send message</button>
  <div class="note">💡 To make this form work, connect it to <a href="https://formspree.io" target="_blank" style="color:var(--accent)">Formspree</a> (free) — takes 2 minutes.</div>
</div>
<footer>© <span id="year"></span> AIToolsReview</footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
